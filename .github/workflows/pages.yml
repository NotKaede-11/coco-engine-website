name: Coco homepage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public-file boundary
        run: python scripts/check_public_files.py
      - name: Check OS detection and release download mapping
        run: node --test scripts/test_website_download.mjs
      - name: Check homepage metadata, assets, and links
        run: python scripts/check_website.py
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only the public homepage
        uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - name: Deploy homepage
        id: deployment
        uses: actions/deploy-pages@v4
